# Local development dependencies. Not intended for production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailed
      POSTGRES_PASSWORD: mailed
      POSTGRES_DB: mailed
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailed"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Catches outbound SMTP locally (http://localhost:8025); nothing leaves your machine.
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres:
