name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mailed
          POSTGRES_PASSWORD: mailed
          POSTGRES_DB: mailed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailed"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mailed:mailed@localhost:5432/mailed_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
